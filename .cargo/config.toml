[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "target-feature=-mmx,-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2,+soft-float",
    "-C", "linker-flavor=ld.lld",
    "-C", "linker=rust-lld",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "relocation-model=static",
]
